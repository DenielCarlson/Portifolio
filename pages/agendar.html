<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../styles/agendar-style.css" />
    <title>Agendar</title>
  </head>

  <body>
    <canvas id="backgroud-stars"></canvas>
    <div class="container">
      <div class="back">
        <a href="../index.html">Voltar</a>
      </div>
      <form action="../index.html">
        <div><label for="name">Nome</label></div>
        <input type="text" placeholder=" Nome" />
        <div><label for="lastName">Sobrenome</label></div>
        <input type="text" placeholder=" Sobrenome" />

        <div><label for="email">Email</label></div>
        <input type="email" placeholder=" Email" />

        <div><label for="phoneNumber">Celular</label></div>
        <input type="tel" placeholder=" Celular" />

        <div><label for="date">Data da reunião</label></div>
        <input type="datetime-local" placeholder=" Data e Hora" />

        <div><label for="desc">Descrição prévia</label></div>
        <textarea placeholder=" Descrição"></textarea>

        <button type="submit">Agendar</button>
      </form>
    </div>

    <script src="../js/background.js"></script>
  </body>
</html>
